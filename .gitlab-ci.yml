stages:
  - build
  - test

build:
  stage: build
  image: rg.fr-par.scw.cloud/scwfunctionsruntimes-public/python-dep:3.13
  before_script:
    - apk add zip git
    - rm -f func.zip
  script:
    - pip install -r requirements.txt --target ./package
    - zip -r func.zip package/ main.py
    - |
      git config user.email "ci@gitlab.miquido.com"
      git config user.name "GitLab CI"
      git add func.zip
      git diff --cached --quiet || git commit -m "ci: rebuild func.zip"
      git push -o ci.skip "https://ci-token:${GITLAB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" HEAD:${CI_COMMIT_REF_NAME}
  tags:
    - docker
    - miquido

validate-readme:
  stage: test
  image: alpine:3.20
  before_script:
    - apk add --no-cache curl
    - curl -sSLo /tmp/terraform-docs.tar.gz https://github.com/terraform-docs/terraform-docs/releases/download/v0.24.0/terraform-docs-v0.24.0-linux-amd64.tar.gz
    - tar -xzf /tmp/terraform-docs.tar.gz -C /usr/local/bin/ terraform-docs
  script:
    - terraform-docs --output-check .
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  tags:
    - docker
    - miquido