stages:
  - build
  - test
  - release

build:
  stage: build
  image: rg.fr-par.scw.cloud/scwfunctionsruntimes-public/python-dep:3.13
  before_script:
    - apk add zip git
    - rm -f func.zip
  script:
    - pip install -r requirements.txt --target ./package
    - zip -r func.zip package/ main.py
    - |
      git config user.email "ci@gitlab.miquido.com"
      git config user.name "GitLab CI"
      git add func.zip
      git diff --cached --quiet || git commit -m "ci: rebuild func.zip"
      git push -o ci.skip "https://ci-token:${GITLAB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" HEAD:${CI_COMMIT_REF_NAME}
  tags:
    - docker
    - miquido

validate-terraform:
  stage: test
  image:
    name: hashicorp/terraform:latest
    entrypoint: [""]
  script:
    - terraform fmt -check -recursive
    - terraform init -backend=false
    - terraform validate
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  tags:
    - docker
    - miquido

validate-readme:
  stage: test
  image: alpine:3.24
  before_script:
    - apk add --no-cache curl
    - curl -sSLo /tmp/terraform-docs.tar.gz https://github.com/terraform-docs/terraform-docs/releases/download/v0.24.0/terraform-docs-v0.24.0-linux-amd64.tar.gz
    - tar -xzf /tmp/terraform-docs.tar.gz -C /usr/local/bin/ terraform-docs
  script:
    - terraform-docs --output-check .
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  tags:
    - docker
    - miquido

release:
  stage: release
  image: node:22-alpine
  before_script:
    - apk add --no-cache git
    # build stage may have pushed a "ci: rebuild func.zip" commit with -o ci.skip,
    # so it never triggered its own pipeline. Fetch the branch tip here to make
    # sure semantic-release tags that commit (if it exists) rather than the
    # older commit this pipeline was originally triggered for.
    - git fetch origin "$CI_COMMIT_REF_NAME"
    - git checkout -B "$CI_COMMIT_REF_NAME" "origin/$CI_COMMIT_REF_NAME"
    - npm install -g semantic-release @semantic-release/changelog @semantic-release/gitlab @semantic-release/git
  script:
    - npx semantic-release
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  tags:
    - docker
    - miquido
